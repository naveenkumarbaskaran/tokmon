[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokmon-ai"
version = "2.0.0"
description = "Lightweight LLM token & cost tracker — drop-in decorator, live dashboards, budget alerts, async support."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Naveen Kumar Baskaran", email = "naveenkb142@gmail.com" },
]
keywords = [
    "llm", "tokens", "cost", "monitoring", "openai", "anthropic",
    "budget", "tracking", "observability", "ai", "agent", "async",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
litellm = ["litellm>=1.40"]
rich = ["rich>=13.7"]
all = ["openai>=1.0", "litellm>=1.40", "rich>=13.7"]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
tokmon = "tokmon.cli:main"

[project.urls]
Homepage = "https://github.com/naveenkumarbaskaran/tokmon"
Repository = "https://github.com/naveenkumarbaskaran/tokmon"
Issues = "https://github.com/naveenkumarbaskaran/tokmon/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tokmon"]

[tool.hatch.build.targets.sdist]
include = ["src/tokmon", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
