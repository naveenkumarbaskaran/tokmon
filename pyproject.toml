[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokmon-ai"
version = "0.1.0"
description = "Lightweight LLM token & cost tracker — drop-in decorator, live dashboards, budget alerts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Naveen Kumar Baskaran", email = "naveenkumarbaskaran@outlook.com" },
]
keywords = [
    "llm", "tokens", "cost", "monitoring", "openai", "anthropic",
    "budget", "tracking", "observability", "ai", "agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
litellm = ["litellm>=1.0"]
rich = ["rich>=13.0"]
all = ["openai>=1.0", "litellm>=1.0", "rich>=13.0"]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=7.0",
    "pytest-cov>=5.0",
]

[project.scripts]
tokmon = "tokmon.cli:main"

[project.urls]
Homepage = "https://github.com/naveenkumarbaskaran/tokmon"
Repository = "https://github.com/naveenkumarbaskaran/tokmon"
Issues = "https://github.com/naveenkumarbaskaran/tokmon/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tokmon"]

[tool.hatch.build.targets.sdist]
include = ["src/tokmon", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
